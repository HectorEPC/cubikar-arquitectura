      // 3. Configuración del Proyecto
      const settingsData = Object.assign({}, defaultSettings, {

        companyLogo: '',

      localStorage.setItem(`control_obra_settings_${projId}`, JSON.stringify(settingsData));

      // 4. Lista de Proyectos en el Portal
      const projectsList = [
        {
          id: projId,
          companyName: 'TALLER ARQUITECTURA',
          projectName: 'Proyecto Arquitectónico Residencia',

      // 5. Preparar Árbol de Entregables
      const tree = JSON.parse(JSON.stringify(defaultTreeData));

      // Función recursiva para buscar y actualizar nodos
      function updateNode(nodes, id, data) {
        for (const n of nodes) {
          if (n.id === id || String(n.clave) === String(id)) {
            Object.assign(n, data);
            return true;
          }
          if (Array.isArray(n.children) && n.children.length > 0) {
            if (updateNode(n.children, id, data)) return true;
          }
        }
        return false;
      }

      // 1.1 Diseño conceptual
      updateNode(tree, '1.1.2', {
        descripcion: 'Análisis del sitio y topografía',
        responsableEmails: ['carlos.gomez.arq@gmail.com'],

        costoSubcontrato: 14500,
        horasHombre: 28
      });

      updateNode(tree, '1.1.3', {

        responsableEmails: ['sofia.valenzuela.admin@gmail.com'],

      updateNode(tree, '1.1.4', {

      updateNode(tree, '1.1.5', {

      // 1.2 Ante proyecto
      updateNode(tree, '1.2.1', {

        responsableEmails: ['carlos.gomez.arq@gmail.com'],

      });

      updateNode(tree, '1.2.2', {
        descripcion: 'Maqueta volumétrica 3D y asoleamiento',
        responsableEmails: ['mariana.torres.costos@gmail.com'],

        archivoLink: 'https://drive.google.com/drive/folders/renders-fotorrealistas',
        costoSubcontrato: 15000,
        horasHombre: 32
      });

      // 1.3 Proyecto Ejecutivo Arquitectonico
      updateNode(tree, '1.3.1', {
        descripcion: 'Plantas arquitectónicas definitivas',
        responsableEmails: ['carlos.gomez.arq@gmail.com'],
        estatus: 'en_proceso',
        avancePorcentaje: 40,

      updateNode(tree, '1.3.2', {
        descripcion: 'Fachadas arquitectónicas acotadas',
        responsableEmails: ['roberto.mendez.obras@gmail.com'],
        estatus: 'en_proceso',
        avancePorcentaje: 35,
        archivoLink: 'https://autodesk360.com/shares/fachadas-cortes.dwg',
        costoSubcontrato: 22000,
        horasHombre: 45
      });

      updateNode(tree, '1.3.3', {
        descripcion: 'Cortes generales y constructivos',
        responsableEmails: ['mariana.torres.costos@gmail.com'],
        estatus: 'pendiente',
        avancePorcentaje: 15,
        archivoLink: '',
        costoSubcontrato: 19000,
        horasHombre: 40
      });

      // Distribuir avances realistas en otros conceptos para que los KPIs reflejen actividad viva
      let leafIndex = 0;
      function seedRestOfTree(nodes) {
        nodes.forEach(n => {
          if (Array.isArray(n.children) && n.children.length > 0) {
            seedRestOfTree(n.children);
          } else {
            // Si ya fue asignado en 1.1 o 1.2 o 1.3, saltar
            if (n.responsableEmails && n.responsableEmails.length > 0) return;
            leafIndex++;
            if (leafIndex % 5 === 0) {
              n.estatus = 'aprobado';
              n.avancePorcentaje = 100;
              n.responsableEmails = ['carlos.gomez.arq@gmail.com'];
              n.costoSubcontrato = 12000;
              n.horasHombre = 25;
            } else if (leafIndex % 5 === 1) {
              n.estatus = 'en_revision';
              n.avancePorcentaje = 80;
              n.responsableEmails = ['sofia.valenzuela.admin@gmail.com'];
              n.costoSubcontrato = 10000;
              n.horasHombre = 20;
            } else if (leafIndex % 5 === 2) {
              n.estatus = 'en_proceso';
              n.avancePorcentaje = 55;
              n.responsableEmails = ['roberto.mendez.obras@gmail.com'];
              n.costoSubcontrato = 15000;
              n.horasHombre = 30;
            } else if (leafIndex % 5 === 3) {
              n.estatus = 'pendiente';
              n.avancePorcentaje = 0;
              n.responsableEmails = ['mariana.torres.costos@gmail.com'];
              n.costoSubcontrato = 8000;
              n.horasHombre = 15;
            } else {
              n.estatus = 'pendiente';
              n.avancePorcentaje = 0;
            }
          }
        });
      }
      seedRestOfTree(tree);

      localStorage.setItem(`control_obra_treeData_${projId}`, JSON.stringify(tree));

      document.getElementById('status').innerHTML = '<span style="color:#22c55e; font-weight:bold;">¡ÉXITO! Datos de seguimiento guardados correctamente en localStorage.</span>';
      console.log('Seed exitoso');
    } catch (err) {
      document.getElementById('status').innerHTML = '<span style="color:#ef4444; font-weight:bold;">Error: ' + err.message + '</span>';
      console.error(err);
    }
